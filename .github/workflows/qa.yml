# Krazow release kit: QA that every app runs on pull requests, pushes to main, and as the first stage of a release.
# Called from an app repo's .github/workflows/ci.yml (see templates/ci.yml).
name: QA

on:
  workflow_call:
    inputs:
      kit_ref:
        description: Version of the release kit to use
        type: string
        default: v1

jobs:
  qa:
    name: Tests and release checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/checkout@v4
        with: { repository: krazow/release-kit, ref: '${{ inputs.kit_ref }}', path: .kit }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Release checks (version, service worker, manifest)
        run: python3 .kit/scripts/kit.py check

      - name: Build the site (beta and production) to make sure both work
        id: build
        run: |
          python3 .kit/scripts/kit.py build-web --channel beta --out /tmp/site-beta
          python3 .kit/scripts/kit.py build-web --channel prod --out /tmp/site-prod

      - name: Install test tools
        run: |
          if [ -f package.json ]; then npm install --no-audit --no-fund; fi
          node -e "require.resolve('playwright')" 2>/dev/null || npm install --no-save --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium

      - name: App tests
        run: |
          if [ -f package.json ] && node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm test
          else
            echo "::error::This app has no tests. Add Playwright smoke tests (copy templates/tests from krazow/release-kit) and a \"test\" script in package.json."
            exit 1
          fi

      - name: Kit smoke test (opens the built site in a browser)
        run: node .kit/scripts/site-check.mjs /tmp/site-prod "${{ steps.build.outputs.app_dir }}"
